[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-safety-guardrail"
version = "0.1.0"
description = "0-19-0 closed-loop AI safety guardrail pipeline built on a 3D+1D Matrix Graph core"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "rayalabs" }
]
keywords = ["ai-safety", "guardrail", "llm", "prompt-injection", "constitutional-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/rayalabs/ai-safety-guardrail"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
